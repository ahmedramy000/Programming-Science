<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>علوم البرمجة // login</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#000000">
<style>
  :root{ --green:#00ff8c; --green-dim:#0a4a30; --bg:#040705; }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg); color:var(--green);
    font-family:"Courier New",ui-monospace,monospace;
    display:flex; align-items:center; justify-content:center;
    min-height:100%; overflow:hidden; position:relative;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  canvas#rain{position:fixed; inset:0; z-index:0; opacity:.55;}

  .panel{
    position:relative; z-index:1; width:min(380px,90vw);
    background:rgba(4,10,6,.82); border:1px solid var(--green-dim);
    border-radius:4px; padding:26px 24px 22px;
    box-shadow:0 0 0 1px rgba(0,255,140,.08), 0 0 36px -6px rgba(0,255,140,.35);
    backdrop-filter:blur(2px);
  }
  .boot{font-size:11px; line-height:1.9; color:#0edb82; margin-bottom:16px; min-height:90px; white-space:pre-wrap;}
  .boot .cur{display:inline-block; width:7px; height:13px; background:var(--green); vertical-align:-2px; animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}

  .brand{font-size:19px; font-weight:bold; letter-spacing:1px; margin-bottom:4px; text-shadow:0 0 8px rgba(0,255,140,.6);}
  .brand::before{content:"> "; opacity:.7;}
  .sub{font-size:11px; color:#0a7a4d; margin-bottom:20px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; color:#0edb82; margin-bottom:5px;}
  .field label::before{content:"$ ";}
  .field input{
    width:100%; background:#050a07; border:1px solid var(--green-dim); border-radius:3px;
    padding:10px 10px; color:var(--green); font-family:inherit; font-size:13px; outline:none;
  }
  .field input:focus{border-color:var(--green); box-shadow:0 0 8px -1px rgba(0,255,140,.5);}

  .go{
    width:100%; margin-top:6px; padding:11px; background:var(--green); color:#021a10;
    border:none; border-radius:3px; font-family:inherit; font-weight:bold; font-size:13.5px;
    letter-spacing:1px; cursor:pointer; text-transform:uppercase;
  }
  .go:active{transform:scale(.98);}

  .skip{display:block; text-align:center; margin-top:14px; font-size:11px; color:#0a7a4d; text-decoration:none;}
  .skip:hover{color:var(--green);}

  .note{margin-top:16px; font-size:10px; color:#0a7a4d; line-height:1.7; border-top:1px solid var(--green-dim); padding-top:10px;}
  .formerr{font-size:11px; color:#ff6666; min-height:14px; margin-bottom:4px;}
  .btn-google{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:14px;font-family:inherit;margin-bottom:10px;}
  .btn-google:hover{border-color:var(--accent);}
</style>
</head>
<body>

<canvas id="rain"></canvas>

<div class="panel">
  <div class="boot" id="boot"></div>
  <div class="brand">علوم البرمجة</div>
  <div class="sub">// access terminal — enter credentials to continue</div>

  <form id="loginForm">
    <div class="field" id="nameField" style="display:none;">
      <label>full_name</label>
      <input type="text" id="fullName" autocomplete="name" placeholder="اسمك الكامل">
    </div>
    <div class="field">
      <label>email</label>
      <input type="email" id="email" autocomplete="email" placeholder="you@mail.com" required>
    </div>
    <div class="field" id="ageField" style="display:none;">
      <label>age</label>
      <input type="number" id="age" min="5" max="18" placeholder="12">
    </div>
    <div class="field">
      <label>password</label>
      <input type="password" id="pass" autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <div class="formerr" id="formErr"></div>
    <button type="submit" class="go" id="goBtn">[ دخول ]</button>
  </form>

  <a class="skip" href="#" id="toggleMode">معندكش حساب؟ اعمل واحد جديد</a>
  <a class="skip" href="home.html">تخطي ← الدخول كزائر</a>
</div>

<script type="module">
import { fbSignup, fbLogin, fbLoginGoogle, fbLogout, fbOnAuthChange } from './assets/js/firebase-init.js';

const API_BASE = 'https://programming-science.onrender.com';
const formErr  = document.getElementById('formErr');

// لو مسجّل دخول بالفعل → روح الرئيسية
fbOnAuthChange((user) => {
  if (user) {
    localStorage.setItem('ps_user', JSON.stringify(user));
    location.replace('home.html');
  } else {
    localStorage.removeItem('ps_user');
    formErr.textContent = '';
  }
});

let signupMode = false;
const nameField    = document.getElementById('nameField');
const switchBtn    = document.getElementById('switchBtn');
const switchMsg    = document.getElementById('switchMsg');
const googleBtn    = document.getElementById('googleBtn');

switchBtn.addEventListener('click', () => {
  signupMode = !signupMode;
  nameField.style.display   = signupMode ? 'block' : 'none';
  switchBtn.textContent     = signupMode ? '[ دخول ]' : '[ تسجيل ]';
  switchMsg.textContent     = signupMode ? 'عندك حساب؟ سجل دخول' : 'معندكش حساب؟ اعمل واحد جديد';
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('pass').value;
  const name     = document.getElementById('name')?.value?.trim() || '';
  formErr.textContent = '⏳ جاري...';
  try {
    const user = signupMode
      ? await fbSignup(name || email, email, password)
      : await fbLogin(email, password);
    localStorage.setItem('ps_user', JSON.stringify(user));
  } catch(e) {
    const msgs = {
      'auth/email-already-in-use': 'الإيميل ده مسجّل قبل كده',
      'auth/wrong-password': 'كلمة المرور غلط',
      'auth/user-not-found': 'مفيش حساب بالإيميل ده',
      'auth/weak-password': 'كلمة المرور لازم تكون 6 حروف على الأقل',
      'auth/invalid-email': 'الإيميل مش صح',
      'auth/invalid-credential': 'الإيميل أو كلمة المرور غلط',
      'auth/too-many-requests': 'محاولات كتير — جرّب بعد شوية',
    };
    formErr.textContent = msgs[e.code] || e.message;
  }
});

// تسجيل دخول بـGoogle
googleBtn && googleBtn.addEventListener('click', async () => {
  formErr.textContent = '⏳ جاري...';
  try {
    const user = await fbLoginGoogle();
    localStorage.setItem('ps_user', JSON.stringify(user));
  } catch(e) {
    formErr.textContent = e.code === 'auth/popup-closed-by-user' ? 'تم إغلاق نافذة Google' : e.message;
  }
});

// دخول كزائر
document.getElementById('guestBtn')?.addEventListener('click', () => {
  localStorage.removeItem('ps_token');
  localStorage.removeItem('ps_user');
  location.href = 'home.html';
});
</script>

</body>
</html>
