<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>علوم البرمجة</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b0c0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0c0f; --text:#e6e8ee; --muted:#8a8f9c;
    --ink:#e9dcc3; --leather-1:#2b1a10; --leather-2:#49281a; --gold:#d9b878;
    --bubble-1:#7c5cff; --bubble-2:#1fd1c9;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:
      radial-gradient(circle at 18% 12%, #171225 0%, transparent 42%),
      radial-gradient(circle at 82% 75%, #0f1d1c 0%, transparent 46%),
      var(--bg);
    color:var(--text); font-family:"Tahoma","Segoe UI",sans-serif;
    min-height:100%; display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }

  .stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:36px 18px 56px;}
  .brand{text-align:center; margin-bottom:38px;}
  .brand h1{margin:0; font-size:clamp(26px,6vw,36px); letter-spacing:.5px; color:var(--text);}
  .brand .tag{color:var(--muted); font-size:13.5px; margin-top:8px;}

  .choices{
    display:grid; grid-template-columns:1fr 1fr; gap:22px;
    width:100%; max-width:1100px;
  }
  @media (max-width:620px){ .choices{grid-template-columns:1fr;} }

  .choice{
    position:relative; display:block; text-decoration:none; overflow:hidden;
    min-height:280px; padding:30px 24px; display:flex; flex-direction:column;
    justify-content:flex-end; transition:transform .2s ease;
  }
  .choice:active{transform:scale(.98);}

  /* ===== الكتاب: جلد، ورق، خط كلاسيكي ===== */
  .choice.book{
    background:
      linear-gradient(155deg, var(--leather-2) 0%, var(--leather-1) 70%);
    border-radius:4px 14px 14px 4px;
    border:1px solid #5c3a22;
    box-shadow:
      0 18px 34px -14px rgba(0,0,0,.6),
      inset 0 0 0 1px rgba(217,184,120,.08);
  }
  /* حواف الصفحات على جنب الكتاب */
  .choice.book::before{
    content:""; position:absolute; inset-block:10px; inset-inline-start:0; width:9px;
    background:repeating-linear-gradient(180deg,#efe3c9 0 2px, #d9c9a4 2px 4px);
    border-radius:3px; box-shadow:2px 0 4px rgba(0,0,0,.35);
  }
  .choice.book .glyph{
    font-family:"Amiri",serif; font-size:52px; color:var(--gold); line-height:1;
    margin-bottom:14px;
  }
  .choice.book h2{
    font-family:"Amiri",serif; font-weight:700; font-size:26px; margin:0 0 10px;
    color:var(--ink);
  }
  .choice.book p{
    font-family:"Amiri",serif; font-size:14.5px; line-height:1.9; color:#c9b89a; margin:0;
  }
  .choice.book .hint{
    margin-top:16px; font-family:"Amiri",serif; font-size:12.5px; color:var(--gold); opacity:.85;
  }

  /* ===== التفاعلي: فقاعة شات حيّة ===== */
  .choice.chatty{
    background:linear-gradient(140deg, var(--bubble-1) 0%, var(--bubble-2) 100%);
    border-radius:28px 28px 6px 28px;
    box-shadow:0 20px 40px -14px rgba(124,92,255,.5);
  }
  .choice.chatty .glyph{font-size:44px; margin-bottom:14px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));}
  .choice.chatty h2{font-family:"Cairo",sans-serif; font-weight:800; font-size:24px; margin:0 0 10px; color:#fff;}
  .choice.chatty p{font-family:"Cairo",sans-serif; font-size:13.5px; line-height:1.85; color:rgba(255,255,255,.92); margin:0;}
  .typing-dots{display:flex; gap:5px; margin-top:16px;}
  .typing-dots span{width:7px; height:7px; border-radius:50%; background:#fff; opacity:.5; animation:dotPulse 1.1s infinite ease-in-out;}
  .typing-dots span:nth-child(2){animation-delay:.15s;}
  .typing-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes dotPulse{0%,80%,100%{opacity:.35; transform:translateY(0);} 40%{opacity:1; transform:translateY(-4px);}}

  .taskbar{
    height:38px; background:#07080a; border-top:1px solid #23262e;
    display:flex; align-items:center; justify-content:space-between; padding:0 14px;
    font-size:12px; color:var(--muted);
  }
  .taskbar .left span{margin-inline-end:8px;}
</style>
</head>
<body>

<div class="stage">
  <div class="brand">
    <h1>علوم البرمجة</h1>
    <div class="tag">اختار إزاي عايز تذاكر</div>
  </div>

  <div class="choices">
    <a class="choice book" href="book/index.html">
      <div class="glyph"><svg class="icon-svg" style="width:50px;height:50px;color:var(--gold)"><use href="#ic-book"/></svg></div>
      <h2>الكتاب</h2>
      <p>مراجعة وتلخيص المنهج — دروس وتدريبات واختبارات وشهادات، بنفس شكل منصة علوم البرمجة الأصلية.</p>
      <div class="hint">مرجعك الثابت ←</div>
    </a>
    <a class="choice chatty" href="interactive.html">
      <div class="glyph"><svg class="icon-svg" style="width:42px;height:42px;color:#fff"><use href="#ic-chat"/></svg></div>
      <h2>التفاعلي</h2>
      <p>اتكلم مع بيكسل، اتعلم بالمحادثة، العب، وابني مسارك في البرمجة والأمن السيبراني من الأساسيات لحد الاحتراف.</p>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </a>
  </div>
</div>

<div class="taskbar">
  <div class="left">
    <span>📶</span><span>🔋</span>
  </div>
  <div class="clock" id="clock">--:--</div>
</div>

<script src="assets/js/icons-inject.js"></script>
<script src="assets/js/index.js"></script>

</body>
</html>
